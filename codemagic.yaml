workflows:
  android-apk:
    name: Venda Camisolas - APK Android
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Preparar projeto Android
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Gerar APK release
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
